name: Deploy frontend to MonsterASP

# main'e her push'ta frontend'i derler ve MonsterASP'e (IIS) FTP ile yükler.
# Backend zaten Render'a GitHub üzerinden otomatik dağıtılıyor.
on:
  push:
    branches: [main]
    # Sadece frontend'i etkileyen değişikliklerde tetiklensin (backend'i Render halleder).
    paths-ignore:
      - 'server/**'
      - 'render.yaml'
      - 'Dockerfile'
      - 'DEPLOY.md'
      - '**.md'
  workflow_dispatch: {} # Panelden elle de tetiklenebilir.

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Üretim API adresi .env.production dosyasından (VITE_API_URL) otomatik okunur.
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # MonsterASP sitenin kök dizini (genelde /). Panele göre gerekirse /wwwroot/ yapın.
          server-dir: /
